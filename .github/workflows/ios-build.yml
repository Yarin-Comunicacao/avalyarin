name: iOS - build Capacitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Synchronize Capacitor iOS
        run: pnpm exec cap sync ios

      - name: Show native tool versions
        run: |
          xcodebuild -version
          xcode-select -p
          node --version
          pnpm --version

      - name: Resolve Swift packages
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Compile iOS without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Store unsigned app artifact
        run: |
          mkdir -p artifacts
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app" artifacts/App.app

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalyarin-ios-unsigned
          path: artifacts/App.app
          if-no-files-found: error
          retention-days: 7
